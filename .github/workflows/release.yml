name: Release

# Tagging is the release switch: push a tag like v0.2.0 and this builds,
# packages and publishes it. Nothing is published from a branch.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, e.g. 0.2.0 (no leading v)"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            # The tag must match VERSION in the source. Without this check the
            # published app could report a different version than the release
            # page, and telemetry would attribute launches to the wrong one.
            declared="$(cat VERSION)"
            if [[ "$version" != "$declared" ]]; then
              echo "::error::tag is v${version} but VERSION says ${declared}"
              exit 1
            fi
          else
            version="${{ inputs.version }}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building $version"

      - name: Test before publishing
        # A release that fails its own checks is worse than no release.
        run: |
          swift build -c release
          swift run -c release PortScope --selftest
          ./scripts/compat/fixtures.sh

      - name: Package
        env:
          PORTSCOPE_TELEMETRY_URL: ${{ vars.PORTSCOPE_TELEMETRY_URL }}
        run: ./scripts/package.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          zip="dist/PortScope-${version}.zip"
          sum="${zip}.sha256"
          test -f "$zip"
          test -f "$sum"

          # Release notes come from the tag message when there is one, so the
          # changelog lives next to the code rather than in a web form.
          notes=$(git tag -l --format='%(contents)' "v${version}" || true)
          if [[ -z "$notes" ]]; then
            notes="PortScope ${version}"
          fi

          gh release create "v${version}" "$zip" "$sum" \
            --title "PortScope ${version}" \
            --notes "$notes" \
            --verify-tag 2>/dev/null || \
          gh release create "v${version}" "$zip" "$sum" \
            --title "PortScope ${version}" \
            --notes "$notes"
