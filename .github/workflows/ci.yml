name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch cancels the previous run: on a PR that is being
# iterated on, the old build's result is already stale.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# CI builds never carry the telemetry receiver URL. Only the release workflow
# bakes it in, so a CI artifact someone downloads and opens is not counted as a
# user. An empty value also overrides one inherited from anywhere else.
env:
  PORTSCOPE_TELEMETRY_URL: ""

jobs:
  build-and-test:
    name: Build and test
    # macos-15 is the oldest runner image with a Swift 6 toolchain. The app's
    # own deployment target is macOS 14, set in Package.swift, and does not
    # depend on the runner image.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          swift --version
          sw_vers

      - name: Build
        run: swift build -c release

      - name: Self-test
        run: swift run -c release PortScope --selftest

      - name: Compatibility matrix
        # Real servers, started here, identified by PortScope, stopped through
        # PortScope. Needs nothing outside the repo.
        run: ./scripts/compat/fixtures.sh

      - name: Telemetry worker
        # Node only, no dependencies. The checks that matter are the privacy
        # ones: fields outside the contract must never reach storage.
        run: node infra/telemetry/worker.test.mjs

      - name: Assemble app bundle
        run: ./scripts/build.sh --release

      - name: Verify bundle
        run: |
          set -euo pipefail
          APP=dist/PortScope.app
          test -x "$APP/Contents/MacOS/PortScope"
          test -f "$APP/Contents/Resources/AppIcon.icns"
          # Both localizations must ship: a missing one silently falls back to
          # English for Chinese users.
          for lang in en.lproj zh-Hans.lproj de.lproj; do
            test -d "$APP/Contents/Resources/$lang" || { echo "missing $lang"; exit 1; }
          done
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Contents/Info.plist"
          codesign --verify --deep --strict "$APP"

      - name: Compile the UI harness
        # The UI checks drive a real app through Accessibility. A runner is a
        # headless macOS instance with no logged-in GUI session, so the harness
        # cannot see a window and every check would fail for a reason unrelated
        # to the change. It runs locally (README › Validation); compiling it
        # here keeps it from rotting.
        run: swiftc -O -parse-as-library Support/Validation/Validation.swift -o /tmp/validate

  package:
    name: Package release
    needs: build-and-test
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Build and zip
        run: ./scripts/package.sh

      - name: Run the Intel slice
        # The runner is Apple silicon, so the x86_64 half of the universal
        # binary is otherwise only ever compiled, never run. Rosetta runs it.
        run: |
          set -euo pipefail
          BIN=dist/PortScope.app/Contents/MacOS/PortScope
          lipo "$BIN" -verify_arch x86_64 arm64
          if ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            softwareupdate --install-rosetta --agree-to-license
          fi
          arch -x86_64 "$BIN" --selftest

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: PortScope-${{ github.sha }}
          path: |
            dist/PortScope-*.zip
            dist/PortScope-*.zip.sha256
          if-no-files-found: error
          retention-days: 14

  lint:
    name: Lint scripts and plist
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Shell scripts parse
        run: |
          set -euo pipefail
          status=0
          for script in scripts/*.sh scripts/compat/*.sh; do
            if ! bash -n "$script"; then
              echo "::error file=$script::syntax error"
              status=1
            fi
          done
          exit $status

      - name: Scripts are executable
        run: |
          set -euo pipefail
          status=0
          for script in scripts/*.sh scripts/compat/*.sh; do
            if [[ ! -x "$script" ]]; then
              echo "::error file=$script::not executable"
              status=1
            fi
          done
          exit $status

      - name: Info.plist is valid
        run: plutil -lint Support/Info.plist

      - name: Localizations have the same keys
        # A key present in English but missing in a translation silently shows
        # the English sentence to that language's users.
        run: |
          python3 - <<'PY'
          import re, sys, pathlib
          root = pathlib.Path("Sources/PortScope/Resources")
          def keys(path):
              text = path.read_text(encoding="utf-8")
              return set(re.findall(r'^"([^"]+)"\s*=', text, re.M))
          en = keys(root / "en.lproj/Localizable.strings")
          failed = False
          for table in sorted(root.glob("*.lproj/Localizable.strings")):
              language = table.parent.name.removesuffix(".lproj")
              if language == "en":
                  continue
              other = keys(table)
              for key in sorted(en - other):
                  print(f"::error::{language} is missing '{key}'")
                  failed = True
              for key in sorted(other - en):
                  print(f"::warning::{language} has '{key}' which English does not")
              print(f"{language}: {len(en)} keys, {len(en - other)} missing, {len(other - en)} extra")
          sys.exit(1 if failed else 0)
          PY

      - name: No credentials committed
        run: |
          set -euo pipefail
          # A cheap guard, not a substitute for secret scanning. Catches the
          # shapes that are easy to paste by accident.
          if git grep -nEI '(ghp_[A-Za-z0-9]{20}|github_pat_[A-Za-z0-9_]{20}|sk-[A-Za-z0-9]{32}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----)'; then
            echo "::error::a credential-shaped string is committed"
            exit 1
          fi
          echo "no credential-shaped strings found"
